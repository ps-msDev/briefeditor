name: release-please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # optional falls dein Code NICHT im Repo-Root liegt:
          # path: .
          # (KEIN package-name mehr angeben – ist kein gültiger Input)
