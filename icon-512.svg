<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#gradient)"/>
  
  <!-- Simple document icon -->
  <g transform="translate(128, 96)">
    <!-- Document shape -->
    <path d="M 0 0 L 160 0 L 256 96 L 256 320 L 0 320 Z" fill="white" opacity="0.95"/>
    
    <!-- Folded corner -->
    <path d="M 160 0 L 160 96 L 256 96 Z" fill="white" opacity="0.7"/>
    
    <!-- Document lines -->
    <line x1="48" y1="144" x2="208" y2="144" stroke="url(#gradient)" stroke-width="10" opacity="0.4" stroke-linecap="round"/>
    <line x1="48" y1="180" x2="208" y2="180" stroke="url(#gradient)" stroke-width="10" opacity="0.4" stroke-linecap="round"/>
    <line x1="48" y1="216" x2="176" y2="216" stroke="url(#gradient)" stroke-width="10" opacity="0.4" stroke-linecap="round"/>
    <line x1="48" y1="252" x2="192" y2="252" stroke="url(#gradient)" stroke-width="10" opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>
