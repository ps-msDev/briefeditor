    <!-- Document lines -->
    <line x1="18" y1="54" x2="78" y2="54" stroke="url(#gradient)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="18" y1="68" x2="78" y2="68" stroke="url(#gradient)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="18" y1="82" x2="66" y2="82" stroke="url(#gradient)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="18" y1="96" x2="72" y2="96" stroke="url(#gradient)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>
